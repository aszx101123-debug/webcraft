name: WebCraft checks

on:
  push:
    branches: ["main", "gh-pages", "fix/**", "chore/**"]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dedicated server dependency
        run: npm ci --prefix server --ignore-scripts --no-fund --no-audit
      - name: Check JavaScript syntax
        run: |
          node --check js/game/config.js
          node --check js/game/noise.js
          node --check js/game/terrain.js
          node --check js/game/textures.js
          node --check js/game/world.js
          node --check js/game/player.js
          node --check js/game/player-model.js
          node --check js/game/fluids.js
          node --check js/game/interaction.js
          node --check js/game/items.js
          node --check js/game/drops.js
          node --check js/game/mobs.js
          node --check js/game/save.js
          node --check js/game/crafting.js
          node --check js/game/ui.js
          node --check js/game/main.js
      - name: Run logic tests
        run: npm test
      - name: Check active game and service worker syntax
        run: |
          for file in js/game/*.js js/*.js server/*.cjs service-worker.js; do
            node --check "$file"
          done
      - name: Check 100 connected players
        run: npm run loadtest

      - name: Package POGL upload
        uses: actions/upload-artifact@v4
        with:
          name: WebCraft-POGL-upload
          path: pogl-game
          if-no-files-found: error
