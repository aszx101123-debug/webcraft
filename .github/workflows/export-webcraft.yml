name: Export WebCraft project

on:
  push:
    branches: ["main"]

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create project zip
        run: zip -r WebCraft-project.zip . -x ".git/*" "WebCraft-project.zip"
      - name: Upload project zip
        uses: actions/upload-artifact@v4
        with:
          name: WebCraft-project
          path: WebCraft-project.zip
