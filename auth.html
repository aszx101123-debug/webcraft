<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WebCraft 계정</title>
<style>body{background:#0c1118;color:#ecf6ed;font:16px system-ui;margin:0;min-height:100vh;display:grid;place-items:center}main{background:#1b2931;border:1px solid #42644b;border-radius:16px;padding:32px;width:min(90vw,390px)}h1{margin:0 0 22px}label{display:block;margin:16px 0}input{box-sizing:border-box;display:block;width:100%;padding:12px;margin-top:6px;background:#fff;color:#111;border:0;border-radius:7px}button{padding:12px 16px;margin:8px 6px 0 0;background:#81c784;color:#102118;border:0;border-radius:7px;font-weight:700;cursor:pointer}button:disabled{opacity:.55}a{color:#abf0b5}#auth-message{min-height:2.5em;overflow-wrap:anywhere}</style>
</head><body><main><a href="index.html">← WebCraft 홈</a><h1 id="auth-title">로그인</h1>
<form id="auth-form"><label>이메일<input id="auth-email" type="email" autocomplete="email" required></label><label>비밀번호<input id="auth-password" type="password" autocomplete="current-password" minlength="8" required></label><button type="submit" id="auth-submit">로그인</button><button type="button" id="auth-toggle">계정이 없나요? 회원가입</button></form>
<p id="auth-message" role="status" aria-live="polite"></p><button id="auth-logout" hidden>로그아웃</button></main><script type="module" src="js/auth-page.js?v=1"></script></body></html>
