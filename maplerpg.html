<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mini Maple RPG — v0.2</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:radial-gradient(circle at top,#26344d 0,#111722 48%,#080b12 100%);color:#fff;font-family:Arial,sans-serif}
body{display:flex;justify-content:center;align-items:center;padding:18px}
.wrap{width:min(1000px,100%)}
.gameBox{position:relative;border:4px solid #080b12;border-radius:14px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.58),0 0 0 1px rgba(255,255,255,.06) inset;background:#111827}
canvas{display:block;width:100%;height:auto;background:#8bd8ff;image-rendering:auto}
.help{padding:11px 14px;background:linear-gradient(#20293b,#151a26);text-align:center;font-size:14px;border-top:1px solid rgba(255,255,255,.1);color:#e9eef8;letter-spacing:.1px}
@media(max-width:700px){.help{font-size:11px;line-height:1.55;padding:9px}}
</style>
</head>
<body>
<div class="wrap">
<div class="gameBox"><canvas id="game" width="1000" height="600"></canvas></div>
<div class="help">← → 이동 · Space 점프 · Z 일반공격 · X 스킬 · I 인벤토리 · Q NPC/퀘스트 · D 던전 · P 일시정지 · S 저장 · L 불러오기 · R 부활</div>
</div>
<script>
"use strict";
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
const W=canvas.width,H=canvas.height;
const keys={};
const pressed={};
addEventListener("keydown",e=>{
  if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"," ","z","x","i","q","d","p","s","l","r","1","2","3","4"].includes(e.key)) e.preventDefault();
  if(!keys[e.key]) pressed[e.key]=true;
  keys[e.key]=true;
});
addEventListener("keyup",e=>keys[e.key]=false);

const JOBS={
  전사:{hp:180,mp:50,atk:18,skill:"파워 슬래시",skillDmg:70,color:"#4f8cff"},
  마법사:{hp:110,mp:120,atk:11,skill:"파이어볼",skillDmg:95,color:"#b36dff"},
  궁수:{hp:135,mp:85,atk:15,skill:"멀티샷",skillDmg:82,color:"#62d48b"},
  도적:{hp:145,mp:70,atk:16,skill:"대시 베기",skillDmg:88,color:"#ffd15c"}
};
const MAPS=[
  {name:"초보자 마을",sky:"#9fe1ff",ground:"#6fbd5d",far:"#7dc8ea"},
  {name:"슬라임 숲",sky:"#8edbff",ground:"#4baa58",far:"#6fbd72"},
  {name:"고대 폐광",sky:"#30344c",ground:"#484c67",far:"#3d415a"}
];

let mode="job",job=null,map=0,paused=false,inventoryOpen=false,dungeon=false,toast="직업을 선택하세요";
let level=1,exp=0,meso=0,skillCd=0,attackCd=0,lastTime=0,shake=0,visualTime=0,walkPhase=0;
let quest={active:false,count:0,goal:5,done:false};
let inventory=["초보자의 물약","초보자의 물약"],equipment={weapon:"낡은 검",armor:"초보자 옷"};
let particles=[],drops=[],monsters=[],projectiles=[];
let player={
  x:130,y:390,w:42,h:62,vy:0,dir:1,hp:180,maxHp:180,mp:50,maxMp:50,onGround:false,invuln:0
};

function rng(a,b){return Math.random()*(b-a)+a}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function setToast(t){toast=t}
function currentStats(){return job?JOBS[job]:JOBS.전사}
function maxExp(){return 100+level*35}
function addExp(n){
  exp+=n;
  while(exp>=maxExp()){
    exp-=maxExp(); level++;
    player.maxHp+=20; player.hp=player.maxHp;
    player.maxMp+=10; player.mp=player.maxMp;
    setToast("레벨 업! Lv."+level);
    burst(player.x+20,player.y+20,"#ffe66d",18);
  }
}
function addDrop(x,y,type,value){
  drops.push({x,y,type,value,vy:-5,life:900});
}
function spawnMonsters(){
  monsters=[];
  if(map===1){
    for(let i=0;i<3;i++)monsters.push(new Monster("슬라임",rng(470,900),390,60,8,30,"#39d77b"));
    monsters.push(new Monster("버섯",rng(580,870),375,90,11,45,"#d86c5d"));
  }else if(map===2){
    monsters.push(new Monster("동굴 박쥐",650,300,120,13,55,"#8b78c9"));
    monsters.push(new Monster("동굴 박쥐",820,340,120,13,55,"#8b78c9"));
    monsters.push(new Monster("광부 골렘",740,350,260,20,120,"#8f95a3"));
  }
}
function Monster(type,x,y,hp,atk,exp,color){
  this.type=type;this.x=x;this.y=y;this.w=type==="광부 골렘"?70:52;this.h=type==="광부 골렘"?74:48;
  this.hp=hp;this.maxHp=hp;this.atk=atk;this.exp=exp;this.color=color;this.alive=true;this.hitCd=0;this.dir=-1;this.t=0;
}
function resetPlayer(){
  const s=currentStats();
  player={x:130,y:390,w:42,h:62,vy:0,dir:1,hp:s.hp,maxHp:s.hp,mp:s.mp,maxMp:s.mp,onGround:false,invuln:0};
}
function chooseJob(index){
  const names=["전사","마법사","궁수","도적"];
  job=names[index];
  resetPlayer();
  mode="play";map=0;dungeon=false;spawnMonsters();
  setToast(job+" 선택 완료!");
}
function basicAttack(){
  if(mode!=="play"||attackCd||paused||dungeon&&boss.hp<=0)return;
  attackCd=16;
  let hit=false;
  if(job==="궁수"){
    projectiles.push({x:player.x+22,y:player.y+24,vx:player.dir*10,dmg:JOBS[job].atk+level*2,life:100,type:"arrow"});
    hit=true;
  }else{
    for(const m of monsters){if(m.alive&&Math.abs((m.x+m.w/2)-(player.x+player.w/2))<92){damageMonster(m,JOBS[job].atk+level*2);hit=true;}}
    if(dungeon&&boss.alive&&Math.abs((boss.x+boss.w/2)-(player.x+player.w/2))<110){damageBoss(JOBS[job].atk+level*2);hit=true;}
  }
  if(hit)burst(player.x+player.w/2+player.dir*35,player.y+25,"#fff",6);
}
function skill(){
  if(mode!=="play"||skillCd||paused)return;
  const s=JOBS[job];
  if(player.mp<20){setToast("MP가 부족합니다.");return}
  player.mp-=20;skillCd=90;
  if(job==="전사"||job==="도적"){
    for(const m of monsters){if(m.alive&&Math.abs((m.x+m.w/2)-(player.x+player.w/2))<160)damageMonster(m,s.skillDmg+level*3);}
    if(dungeon&&boss.alive&&Math.abs((boss.x+boss.w/2)-(player.x+player.w/2))<190)damageBoss(s.skillDmg+level*3);
    if(job==="도적")player.x=clamp(player.x+player.dir*90,40,940);
  }else if(job==="마법사"){
    projectiles.push({x:player.x+22,y:player.y+18,vx:player.dir*8,dmg:s.skillDmg+level*3,life:150,type:"fire"});
  }else if(job==="궁수"){
    for(const d of [-1,0,1])projectiles.push({x:player.x+22,y:player.y+24,vx:player.dir*(9+d*1.2),dmg:s.skillDmg+level*3,life:120,type:"arrow"});
  }
  setToast(s.skill+"!");
}
function damageMonster(m,dmg){
  if(!m.alive)return;
  m.hp-=dmg;shake=5;
  burst(m.x+m.w/2,m.y+15,"#ffd2d2",8);
  if(m.hp<=0){
    m.alive=false; addExp(m.exp); const v=Math.floor(rng(20,80)); addDrop(m.x,m.y-15,"meso",v);
    if(Math.random()<.35)addDrop(m.x+15,m.y-10,"potion",1);
    if(quest.active&&!quest.done&&m.type==="슬라임"){quest.count++;if(quest.count>=quest.goal){quest.done=true;setToast("퀘스트 완료! NPC에게 돌아가세요.");}}
    setTimeout(()=>{if(mode==="play"&&!dungeon&&((map===1)||(map===2&&monsters.filter(x=>x.alive).length===0)))spawnMonsters();},1200);
  }
}
const boss={x:760,y:310,w:105,h:120,hp:1400,maxHp:1400,alive:false,atk:28,t:0,hitCd:0};
function enterDungeon(){
  if(map!==2||dungeon)return;
  dungeon=true;boss.alive=true;boss.hp=boss.maxHp;boss.x=760;boss.t=0;setToast("고대 폐광의 보스방에 입장!");
}
function damageBoss(dmg){
  if(!boss.alive)return;
  boss.hp-=dmg;shake=8;burst(boss.x+boss.w/2,boss.y+35,"#f0b6ff",10);
  if(boss.hp<=0){
    boss.hp=0;boss.alive=false;dungeon=false;meso+=1500;addExp(500);addDrop(boss.x,boss.y,"meso",1500);setToast("광산의 수호자 처치! 보상 1,500 메소");
  }
}
function usePotion(){
  const i=inventory.indexOf("초보자의 물약");
  if(i<0){setToast("사용할 물약이 없습니다.");return}
  if(player.hp>=player.maxHp){setToast("HP가 가득합니다.");return}
  inventory.splice(i,1);player.hp=clamp(player.hp+70,0,player.maxHp);setToast("HP 물약 사용!");
}
function talkNpc(){
  if(map!==0){setToast("NPC는 초보자 마을에 있습니다.");return}
  if(!quest.active){quest={active:true,count:0,goal:5,done:false};setToast("퀘스트: 슬라임 5마리 처치");}
  else if(quest.done){quest.active=false;quest.done=false;quest.count=0;meso+=300;addExp(120);inventory.push("초보자의 물약");setToast("퀘스트 보상: 300 메소 + 물약 + 120 EXP");}
  else setToast("퀘스트 진행 "+quest.count+"/"+quest.goal);
}
function saveGame(){
  localStorage.setItem("miniMapleV02",JSON.stringify({job,map,level,exp,meso,inventory,equipment,quest}));
  setToast("저장 완료");
}
function loadGame(){
  const d=JSON.parse(localStorage.getItem("miniMapleV02")||"null");
  if(!d){setToast("저장된 데이터가 없습니다.");return}
  job=d.job;map=d.map||0;level=d.level||1;exp=d.exp||0;meso=d.meso||0;inventory=d.inventory||[];
  equipment=d.equipment||equipment;quest=d.quest||quest;resetPlayer();mode="play";dungeon=false;spawnMonsters();
  setToast("저장 데이터 불러오기 완료");
}
function hurt(n){
  if(player.invuln>0||mode!=="play")return;
  player.hp-=Math.max(1,n);
  player.invuln=50;shake=8;burst(player.x+20,player.y+20,"#ff6b6b",10);
  if(player.hp<=0){player.hp=0;mode="dead";setToast("쓰러졌습니다. R 키로 마을에서 부활");}
}
function respawn(){if(mode!=="dead")return;map=0;dungeon=false;resetPlayer();spawnMonsters();mode="play";setToast("마을에서 부활했습니다.");}
function update(dt){
  visualTime+=dt;
  if(mode!=="play"||paused)return;
  if(attackCd>0)attackCd--;if(skillCd>0)skillCd--;if(player.invuln>0)player.invuln--;if(shake>0)shake--;
  if(keys.ArrowRight){player.x+=4.2;player.dir=1;walkPhase+=0.32}
  if(keys.ArrowLeft){player.x-=4.2;player.dir=-1;walkPhase+=0.32}
  if(!keys.ArrowLeft&&!keys.ArrowRight)walkPhase*=0.9;
  if(keys[" "]&&player.onGround){player.vy=-11.5;player.onGround=false}
  player.vy+=0.55;player.y+=player.vy;
  if(player.y>=390){player.y=390;player.vy=0;player.onGround=true}
  player.x=clamp(player.x,20,938);
  if(map===1&&!dungeon&&monsters.some(m=>m.alive)&&Math.abs(player.x-600)<20&&keys.ArrowRight){}
  if(player.x>955){
    if(map<2){map++;player.x=35;spawnMonsters();setToast(MAPS[map].name+"으로 이동");}
    else {player.x=950;enterDungeon();}
  }
  if(player.x<15&&map>0){map--;player.x=930;spawnMonsters();setToast(MAPS[map].name+"으로 이동");}
  for(const m of monsters){
    if(!m.alive)continue;
    if(m.hitCd>0)m.hitCd--;
    m.t+=dt;
    const dist=player.x-m.x;
    if(Math.abs(dist)<260){m.dir=dist>0?1:-1;m.x+=m.dir*(m.type==="광부 골렘"?0.6:1.0);}
    if(Math.abs(dist)<55&&m.hitCd===0){hurt(m.atk);m.hitCd=55;}
    if(m.type==="동굴 박쥐")m.y=315+Math.sin(m.t/160)*34;
  }
  if(dungeon&&boss.alive){
    boss.t+=dt;if(boss.hitCd>0)boss.hitCd--;
    boss.x=clamp(boss.x+(player.x>boss.x?0.9:-0.9),620,880);
    if(Math.abs(player.x-boss.x)<100&&boss.hitCd===0){hurt(boss.atk);boss.hitCd=45;}
  }
  for(let i=projectiles.length-1;i>=0;i--){
    const p=projectiles[i];p.x+=p.vx;p.life--;
    let removed=false;
    for(const m of monsters){if(m.alive&&Math.abs(p.x-(m.x+m.w/2))<35&&Math.abs(p.y-(m.y+m.h/2))<45){damageMonster(m,p.dmg);removed=true;break;}}
    if(!removed&&dungeon&&boss.alive&&Math.abs(p.x-(boss.x+boss.w/2))<60&&Math.abs(p.y-(boss.y+boss.h/2))<70){damageBoss(p.dmg);removed=true}
    if(removed||p.life<=0||p.x<0||p.x>W)projectiles.splice(i,1);
  }
  for(let i=drops.length-1;i>=0;i--){
    const d=drops[i];d.y+=d.vy;d.vy+=0.25;d.life--;
    if(d.y>435){d.y=435;d.vy=0}
    if(Math.abs(player.x-d.x)<42){
      if(d.type==="meso"){meso+=d.value;setToast("메소 +"+d.value)}
      else {inventory.push("초보자의 물약");setToast("물약 획득!")}
      drops.splice(i,1);
    }else if(d.life<=0)drops.splice(i,1);
  }
  if(player.mp<player.maxMp)player.mp=Math.min(player.maxMp,player.mp+0.12);
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.08;p.life--;if(p.life<=0)particles.splice(i,1);}
}
function burst(x,y,color,n){
  for(let i=0;i<n;i++)particles.push({x,y,vx:rng(-3,3),vy:rng(-4,1),life:rng(20,45),color});
}
function rect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(x,y,w,h)}
function text(t,x,y,size=18,color="#fff",align="left"){ctx.font=size+"px Arial";ctx.fillStyle=color;ctx.textAlign=align;ctx.fillText(t,x,y);ctx.textAlign="left"}
function bar(x,y,w,h,val,max,color){
  rect(x,y,w,h,"#171a22");rect(x+2,y+2,(w-4)*clamp(val/max,0,1),h-4,color);
}
function drawBackground(){
  const m=MAPS[map];
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,m.sky);g.addColorStop(.62,m.far);g.addColorStop(1,map===2?"#252a3b":m.ground);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  // distant hills
  ctx.globalAlpha=.38;
  ctx.fillStyle=map===2?"#1c2030":"#5f99ad";
  for(let x=-80;x<W+120;x+=180){
    ctx.beginPath();ctx.moveTo(x,330);ctx.quadraticCurveTo(x+85,245,x+180,330);ctx.lineTo(x+180,430);ctx.lineTo(x,430);ctx.closePath();ctx.fill();
  }
  ctx.globalAlpha=1;

  if(map===0){
    // village road
    ctx.fillStyle="#d9be8e";ctx.beginPath();ctx.moveTo(0,405);ctx.quadraticCurveTo(260,370,510,410);ctx.quadraticCurveTo(760,450,1000,410);ctx.lineTo(1000,450);ctx.lineTo(0,450);ctx.closePath();ctx.fill();
    // houses
    for(let x=70;x<950;x+=260){
      const y=292+(x%130);
      ctx.fillStyle="#8b5438";ctx.fillRect(x,y,150,112);
      ctx.fillStyle="#e4b36d";ctx.fillRect(x+12,y+42,52,50);ctx.fillRect(x+86,y+42,52,50);
      ctx.fillStyle="#7a3f34";ctx.beginPath();ctx.moveTo(x-12,y);ctx.lineTo(x+75,y-62);ctx.lineTo(x+162,y);ctx.closePath();ctx.fill();
      ctx.fillStyle="#d8f2ff";ctx.fillRect(x+27,y+55,22,20);ctx.fillRect(x+101,y+55,22,20);
      ctx.fillStyle="#5d3a2a";ctx.fillRect(x+63,y+72,24,40);
      ctx.fillStyle="#f2d38a";ctx.fillRect(x+68,y+78,5,5);
    }
    // trees
    for(let x=22;x<W;x+=125){
      ctx.fillStyle="#6f4a32";ctx.fillRect(x,275,22,130);
      ctx.fillStyle="#3f8f52";ctx.beginPath();ctx.arc(x+12,252,48,0,Math.PI*2);ctx.fill();
      ctx.fillStyle="#5bb867";ctx.beginPath();ctx.arc(x-18,268,28,0,Math.PI*2);ctx.arc(x+38,267,30,0,Math.PI*2);ctx.fill();
      ctx.fillStyle="rgba(255,255,255,.13)";ctx.beginPath();ctx.arc(x-3,237,12,0,Math.PI*2);ctx.fill();
    }
  }else if(map===1){
    // layered forest
    for(let x=0;x<W;x+=110){
      const h=130+(x%80);
      ctx.fillStyle="#5a3f2c";ctx.fillRect(x+44,450-h,24,h);
      ctx.fillStyle="#2f7f48";ctx.beginPath();ctx.arc(x+55,390-h,48,0,Math.PI*2);ctx.fill();
      ctx.fillStyle="#3f9c55";ctx.beginPath();ctx.arc(x+23,405-h,38,0,Math.PI*2);ctx.arc(x+86,410-h,42,0,Math.PI*2);ctx.fill();
      ctx.fillStyle="rgba(255,255,255,.10)";ctx.beginPath();ctx.arc(x+36,370-h,12,0,Math.PI*2);ctx.fill();
    }
    // grass/flowers
    ctx.strokeStyle="#8bdb72";ctx.lineWidth=2;
    for(let x=0;x<W;x+=22){ctx.beginPath();ctx.moveTo(x,448);ctx.lineTo(x+4,438);ctx.moveTo(x+5,448);ctx.lineTo(x+9,440);ctx.stroke();}
    ctx.fillStyle="#ffd16a";for(let x=35;x<W;x+=170){ctx.beginPath();ctx.arc(x,430,3,0,Math.PI*2);ctx.fill();}
    ctx.fillStyle="#f0839b";for(let x=105;x<W;x+=220){ctx.beginPath();ctx.arc(x,422,3,0,Math.PI*2);ctx.fill();}
  }else{
    // mine ceiling/walls
    ctx.fillStyle="#191d2c";
    ctx.beginPath();ctx.moveTo(0,75);ctx.lineTo(110,35);ctx.lineTo(220,80);ctx.lineTo(340,28);ctx.lineTo(470,72);ctx.lineTo(590,40);ctx.lineTo(720,86);ctx.lineTo(850,30);ctx.lineTo(1000,70);ctx.lineTo(1000,0);ctx.lineTo(0,0);ctx.closePath();ctx.fill();
    for(let x=55;x<W;x+=145){
      ctx.fillStyle="#4d536a";ctx.beginPath();ctx.moveTo(x,180);ctx.lineTo(x+65,110);ctx.lineTo(x+125,178);ctx.lineTo(x+88,195);ctx.closePath();ctx.fill();
      ctx.fillStyle="#6e7590";ctx.fillRect(x+28,155,20,55);
    }
    // rails
    ctx.strokeStyle="#7e869d";ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(0,426);ctx.lineTo(W,426);ctx.moveTo(0,454);ctx.lineTo(W,454);ctx.stroke();
    for(let x=0;x<W;x+=52){ctx.strokeStyle="#5f667b";ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x,418);ctx.lineTo(x+20,464);ctx.stroke();}
    // crystals
    for(let x=90;x<W;x+=220){
      ctx.fillStyle="#6f7cff";ctx.beginPath();ctx.moveTo(x,405);ctx.lineTo(x+22,335);ctx.lineTo(x+41,403);ctx.lineTo(x+62,350);ctx.lineTo(x+78,410);ctx.closePath();ctx.fill();
      ctx.fillStyle="rgba(175,207,255,.5)";ctx.beginPath();ctx.moveTo(x+22,335);ctx.lineTo(x+32,388);ctx.lineTo(x+22,405);ctx.closePath();ctx.fill();
    }
  }
  // foreground grass/stone lip
  ctx.fillStyle=map===2?"#30364e":"#4b9348";ctx.fillRect(0,450,W,150);
  ctx.fillStyle=map===2?"#414862":"#79c75e";
  for(let x=0;x<W;x+=34){ctx.fillRect(x,447-(x%3)*2,24,8);}
}
function drawPlayer(){
  if(player.invuln>0&&Math.floor(player.invuln/5)%2===0)return;
  const s=JOBS[job], moving=(keys.ArrowLeft||keys.ArrowRight)&&player.onGround;
  const bob=player.onGround?(moving?Math.sin(walkPhase)*2:Math.sin(visualTime/340)*.7):0;
  const legSwing=moving?Math.sin(walkPhase)*5:0;
  const x=player.x,y=player.y+bob;

  ctx.save();
  // shadow
  ctx.fillStyle="rgba(10,20,25,.22)";ctx.beginPath();ctx.ellipse(x+22,456,25,7,0,0,Math.PI*2);ctx.fill();

  // cape/back detail by class
  if(job==="마법사"){ctx.fillStyle="#533d88";ctx.beginPath();ctx.moveTo(x+6,y+26);ctx.lineTo(x+2,y+59);ctx.lineTo(x+20,y+52);ctx.lineTo(x+32,y+59);ctx.lineTo(x+37,y+25);ctx.closePath();ctx.fill();}
  if(job==="도적"){ctx.fillStyle="#252936";ctx.beginPath();ctx.moveTo(x+3,y+25);ctx.lineTo(x+39,y+25);ctx.lineTo(x+34,y+54);ctx.lineTo(x+8,y+54);ctx.closePath();ctx.fill();}

  // legs + boots
  ctx.fillStyle="#26344e";ctx.fillRect(x+8,y+49+legSwing,10,15);ctx.fillRect(x+24,y+49-legSwing,10,15);
  ctx.fillStyle="#171b28";ctx.fillRect(x+5,y+60+legSwing,15,7);ctx.fillRect(x+23,y+60-legSwing,16,7);
  // torso
  ctx.fillStyle=s.color;ctx.beginPath();ctx.roundRect(x+5,y+23,32,30,7);ctx.fill();
  ctx.fillStyle="rgba(255,255,255,.18)";ctx.fillRect(x+10,y+27,22,5);
  // belt
  ctx.fillStyle="#5a402e";ctx.fillRect(x+8,y+46,26,5);
  ctx.fillStyle="#f6d56a";ctx.fillRect(x+19,y+45,6,7);
  // arms
  const armY=y+30;
  ctx.fillStyle=s.color;ctx.beginPath();ctx.roundRect(x-4,armY,10,24,5);ctx.fill();ctx.beginPath();ctx.roundRect(x+36,armY,10,24,5);ctx.fill();
  ctx.fillStyle="#f2be92";ctx.fillRect(x-2,armY+19,7,6);ctx.fillRect(x+38,armY+19,7,6);

  // neck/head
  ctx.fillStyle="#f2be92";ctx.fillRect(x+16,y+17,11,10);
  ctx.fillStyle="#f2be92";ctx.beginPath();ctx.roundRect(x+7,y-2,28,27,9);ctx.fill();
  // ears
  ctx.fillRect(x+4,y+8,5,9);ctx.fillRect(x+33,y+8,5,9);
  // hair
  ctx.fillStyle=job==="마법사"?"#6c4a88":job==="궁수"?"#593f2f":"#4b3227";
  ctx.beginPath();ctx.moveTo(x+7,y+10);ctx.quadraticCurveTo(x+8,y-8,x+22,y-7);ctx.quadraticCurveTo(x+37,y-6,x+35,y+10);ctx.lineTo(x+29,y+5);ctx.lineTo(x+24,y+9);ctx.lineTo(x+19,y+4);ctx.lineTo(x+13,y+10);ctx.closePath();ctx.fill();
  // eyes
  ctx.fillStyle="#222";ctx.fillRect(x+14,y+11,4,5);ctx.fillRect(x+25,y+11,4,5);
  ctx.fillStyle="#fff";ctx.fillRect(x+15,y+11,2,2);ctx.fillRect(x+26,y+11,2,2);
  // mouth
  ctx.fillStyle="#ad665e";ctx.fillRect(x+19,y+19,6,2);

  // weapon / class detail
  ctx.save();ctx.translate(x+22,y+39);ctx.scale(player.dir,1);
  if(job==="전사"){
    ctx.fillStyle="#dfe8f7";ctx.beginPath();ctx.moveTo(6,-27);ctx.lineTo(12,-27);ctx.lineTo(15,6);ctx.lineTo(10,12);ctx.lineTo(5,6);ctx.closePath();ctx.fill();
    ctx.fillStyle="#7b4c2a";ctx.fillRect(2,9,18,4);ctx.fillStyle="#e7c36d";ctx.fillRect(9,5,4,14);
  }else if(job==="마법사"){
    ctx.fillStyle="#6e4931";ctx.fillRect(9,-3,5,23);
    ctx.fillStyle="#9deaff";ctx.beginPath();ctx.arc(11,-10,8,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="rgba(255,255,255,.7)";ctx.beginPath();ctx.arc(8,-13,3,0,Math.PI*2);ctx.fill();
  }else if(job==="궁수"){
    ctx.strokeStyle="#f3e1bc";ctx.lineWidth=3;ctx.beginPath();ctx.arc(7,-7,15,-1.15,1.15);ctx.stroke();
    ctx.strokeStyle="#fff4dc";ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(0,-21);ctx.lineTo(18,7);ctx.stroke();
    ctx.fillStyle="#e5d2a3";ctx.fillRect(7,-8,23,2);
  }else{
    ctx.fillStyle="#d9e0ea";ctx.beginPath();ctx.moveTo(7,-23);ctx.lineTo(12,-25);ctx.lineTo(13,3);ctx.lineTo(8,3);ctx.closePath();ctx.fill();
    ctx.fillStyle="#8b6f58";ctx.fillRect(5,5,12,4);
  }
  ctx.restore();

  if(moving){ctx.fillStyle="rgba(255,255,255,.12)";ctx.fillRect(x+3,y+33,3,9);ctx.fillRect(x+39,y+36,3,8);}
  ctx.restore();
}
function drawMonster(m){
  if(!m.alive)return;
  const bob=(m.type==="동굴 박쥐")?Math.sin(visualTime/140+m.x)*3:Math.sin(visualTime/260+m.x)*1.5;
  const x=m.x,y=m.y+bob;
  ctx.save();
  ctx.fillStyle="rgba(10,20,25,.22)";ctx.beginPath();ctx.ellipse(x+m.w/2,455,m.w*.45,6,0,0,Math.PI*2);ctx.fill();

  if(m.type==="슬라임"){
    const grad=ctx.createLinearGradient(x,y,x,y+45);grad.addColorStop(0,"#8af08d");grad.addColorStop(.45,m.color);grad.addColorStop(1,"#219b6b");
    ctx.fillStyle=grad;ctx.beginPath();ctx.moveTo(x+4,y+42);ctx.quadraticCurveTo(x+3,y+14,x+26,y+7);ctx.quadraticCurveTo(x+49,y+14,x+48,y+42);ctx.quadraticCurveTo(x+26,y+50,x+4,y+42);ctx.fill();
    ctx.fillStyle="rgba(255,255,255,.35)";ctx.beginPath();ctx.ellipse(x+18,y+18,8,4,-.45,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#26323b";ctx.beginPath();ctx.arc(x+18,y+28,3,0,Math.PI*2);ctx.arc(x+34,y+28,3,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#6d3450";ctx.beginPath();ctx.arc(x+26,y+36,5,0,Math.PI);ctx.stroke();
  }else if(m.type==="버섯"){
    ctx.fillStyle="#f4dfaa";ctx.beginPath();ctx.roundRect(x+12,y+18,30,29,9);ctx.fill();
    ctx.fillStyle="#d85a4e";ctx.beginPath();ctx.arc(x+27,y+16,27,Math.PI,0);ctx.lineTo(x+54,y+24);ctx.lineTo(x,y+24);ctx.closePath();ctx.fill();
    ctx.fillStyle="#fff1de";for(const p of [[9,7],[31,4],[43,14]]){ctx.beginPath();ctx.arc(x+p[0],y+p[1],5,0,Math.PI*2);ctx.fill();}
    ctx.fillStyle="#25303b";ctx.beginPath();ctx.arc(x+19,y+30,3,0,Math.PI*2);ctx.arc(x+35,y+30,3,0,Math.PI*2);ctx.fill();
  }else if(m.type==="동굴 박쥐"){
    ctx.fillStyle="#8d79c6";ctx.beginPath();ctx.moveTo(x+24,y+10);ctx.lineTo(x-4,y-1);ctx.lineTo(x+5,y+18);ctx.lineTo(x+24,y+13);ctx.lineTo(x+50,y+18);ctx.lineTo(x+58,y-1);ctx.closePath();ctx.fill();
    ctx.fillStyle="#bba8ea";ctx.beginPath();ctx.moveTo(x+24,y+13);ctx.lineTo(x+9,y+7);ctx.lineTo(x+15,y+22);ctx.closePath();ctx.fill();
    ctx.fillStyle="#f4e5a0";ctx.fillRect(x+18,y+18,4,5);ctx.fillRect(x+30,y+18,4,5);
    ctx.fillStyle="#272334";ctx.beginPath();ctx.arc(x+20,y+22,2.5,0,Math.PI*2);ctx.arc(x+32,y+22,2.5,0,Math.PI*2);ctx.fill();
  }else{
    // golem
    const grad=ctx.createLinearGradient(x,y,x+m.w,y+m.h);grad.addColorStop(0,"#b8bec8");grad.addColorStop(.5,m.color);grad.addColorStop(1,"#606775");
    ctx.fillStyle=grad;ctx.beginPath();ctx.roundRect(x,y,m.w,m.h,12);ctx.fill();
    ctx.fillStyle="#3b414d";ctx.fillRect(x+10,y+12,20,22);ctx.fillRect(x+40,y+12,20,22);
    ctx.fillStyle="#d7b96b";ctx.fillRect(x+14,y+17,10,8);ctx.fillRect(x+44,y+17,10,8);
    ctx.fillStyle="#646b78";ctx.fillRect(x+18,y+44,34,10);ctx.fillRect(x+27,y+60,18,8);
    ctx.fillStyle="#8c93a2";ctx.fillRect(x-6,y+28,10,30);ctx.fillRect(x+m.w-4,y+28,10,30);
  }
  bar(x,y-16,m.w,7,m.hp,m.maxHp,"#ed5360");text(m.type,x+m.w/2,y-21,12,"#fff","center");
  ctx.restore();
}

function drawBoss(){
  if(!dungeon||!boss.alive)return;
  ctx.save();
  ctx.fillStyle="rgba(10,10,20,.35)";ctx.beginPath();ctx.ellipse(boss.x+52,457,48,9,0,0,Math.PI*2);ctx.fill();

  const aura=ctx.createRadialGradient(boss.x+52,boss.y+55,10,boss.x+52,boss.y+55,95);
  aura.addColorStop(0,"rgba(217,132,255,.36)");aura.addColorStop(1,"rgba(70,20,100,0)");
  ctx.fillStyle=aura;ctx.beginPath();ctx.arc(boss.x+52,boss.y+55,95,0,Math.PI*2);ctx.fill();

  ctx.fillStyle="#7a3093";ctx.beginPath();ctx.roundRect(boss.x,boss.y,boss.w,boss.h,18);ctx.fill();
  ctx.fillStyle="#a64cc2";ctx.beginPath();ctx.ellipse(boss.x+52,boss.y+46,41,28,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#efc49a";ctx.fillRect(boss.x+19,boss.y+26,25,26);ctx.fillRect(boss.x+61,boss.y+26,25,26);
  ctx.fillStyle="#2e1639";ctx.fillRect(boss.x+20,boss.y+68,65,35);
  ctx.fillStyle="#f3db75";ctx.fillRect(boss.x+24,boss.y+75,16,5);ctx.fillRect(boss.x+65,boss.y+75,16,5);
  ctx.fillStyle="#201524";ctx.fillRect(boss.x+29,boss.y+34,7,7);ctx.fillRect(boss.x+69,boss.y+34,7,7);
  ctx.fillStyle="#f6b2ff";ctx.beginPath();ctx.arc(boss.x+52,boss.y+3+Math.sin(visualTime/180)*2,12,0,Math.PI*2);ctx.fill();

  bar(220,56,560,20,boss.hp,boss.maxHp,"#e94b72");
  text("광산의 수호자",500,48,19,"#fff","center");
  text(Math.ceil(boss.hp)+" / "+boss.maxHp,500,72,12,"#f7dce6","center");
  ctx.restore();
}

function drawHUD(){
  // left stat card
  const panel=ctx.createLinearGradient(16,16,16,122);panel.addColorStop(0,"rgba(18,25,38,.94)");panel.addColorStop(1,"rgba(7,11,18,.90)");
  ctx.fillStyle=panel;ctx.beginPath();ctx.roundRect(16,16,318,108,12);ctx.fill();
  ctx.strokeStyle="rgba(255,255,255,.10)";ctx.stroke();

  text("Lv."+level+"  "+job,30,42,22,"#fff");
  text("초보 모험가",30,62,12,"#aeb8c9");

  ctx.fillStyle="#151922";ctx.beginPath();ctx.roundRect(30,72,190,15,7);ctx.fill();
  const hg=ctx.createLinearGradient(30,72,220,72);hg.addColorStop(0,"#ff666d");hg.addColorStop(1,"#c9324a");ctx.fillStyle=hg;ctx.beginPath();ctx.roundRect(32,74,186*clamp(player.hp/player.maxHp,0,1),11,5);ctx.fill();
  text("HP "+player.hp+"/"+player.maxHp,227,84,12,"#ffd6d8");

  ctx.fillStyle="#151922";ctx.beginPath();ctx.roundRect(30,94,190,13,6);ctx.fill();
  const mg=ctx.createLinearGradient(30,94,220,94);mg.addColorStop(0,"#63c4ff");mg.addColorStop(1,"#4779ef");ctx.fillStyle=mg;ctx.beginPath();ctx.roundRect(32,96,186*clamp(player.mp/player.maxMp,0,1),9,4);ctx.fill();
  text("MP "+Math.floor(player.mp)+"/"+player.maxMp,227,105,12,"#cfe8ff");

  text("EXP",30,118,11,"#9aa5b7");text(exp+"/"+maxExp(),69,118,11,"#e7edf7");
  text("메소 "+meso,170,118,11,"#ffd76a");

  // right map card
  ctx.fillStyle="rgba(12,18,28,.88)";ctx.beginPath();ctx.roundRect(700,16,284,62,12);ctx.fill();
  text(dungeon?"BOSS ROOM":MAPS[map].name,718,41,19,"#fff");
  text("스킬  "+(skillCd?"재사용 "+Math.ceil(skillCd/30)+"s":"사용 가능"),718,62,13,skillCd?"#ffc56b":"#8cf6a0");

  if(quest.active){
    ctx.fillStyle="rgba(12,18,28,.90)";ctx.beginPath();ctx.roundRect(665,91,319,66,12);ctx.fill();
    text("퀘스트",683,114,13,"#ffd76a");text("슬라임  "+quest.count+"/"+quest.goal,683,137,16,"#fff");
    if(quest.done)text("완료! NPC에게 돌아가기",820,137,12,"#8df59b","center");
  }

  // toast
  const tg=ctx.createLinearGradient(340,526,660,566);tg.addColorStop(0,"rgba(36,43,58,.94)");tg.addColorStop(1,"rgba(13,17,25,.94)");
  ctx.fillStyle=tg;ctx.beginPath();ctx.roundRect(340,520,320,48,12);ctx.fill();
  ctx.strokeStyle="rgba(255,255,255,.08)";ctx.stroke();
  text(toast,500,550,14,"#fff","center");
}

function drawInventory(){
  if(!inventoryOpen)return;
  ctx.fillStyle="rgba(4,7,12,.80)";ctx.fillRect(0,0,W,H);
  const bg=ctx.createLinearGradient(180,84,820,500);bg.addColorStop(0,"#2a3346");bg.addColorStop(1,"#141a25");
  ctx.fillStyle=bg;ctx.beginPath();ctx.roundRect(175,80,650,420,16);ctx.fill();
  ctx.strokeStyle="rgba(255,255,255,.15)";ctx.stroke();

  text("인벤토리",210,124,30,"#fff");text("장비",210,159,15,"#ffd76a");
  ctx.fillStyle="#202838";ctx.beginPath();ctx.roundRect(205,176,225,90,10);ctx.fill();
  text("무기",223,201,12,"#9eabba");text(equipment.weapon,223,224,18,"#fff");
  text("방어구",223,248,12,"#9eabba");text(equipment.armor,282,248,14,"#e8edf6");

  text("소지 아이템",465,159,15,"#8edcff");
  for(let i=0;i<18;i++){
    const x=460+(i%6)*54,y=176+Math.floor(i/6)*65;
    ctx.fillStyle="#151b28";ctx.beginPath();ctx.roundRect(x,y,46,46,8);ctx.fill();
    ctx.strokeStyle="rgba(255,255,255,.08)";ctx.stroke();
    if(inventory[i]){
      const isPotion=inventory[i].includes("물약");
      ctx.fillStyle=isPotion?"#ff6d83":"#ffd75e";ctx.beginPath();ctx.arc(x+23,y+22,10,0,Math.PI*2);ctx.fill();
      text(isPotion?"♥":"✦",x+23,y+28,15,"#fff","center");
    }
    text(String(i+1),x+5,y+41,10,"#8893a7");
  }
  text("I: 닫기",210,470,13,"#aeb8ca");
  text("아이템을 획득하면 이곳에 표시됩니다.",355,470,13,"#7f8ca1");
}

function drawOverlay(){
  if(paused&&mode==="play"){
    ctx.fillStyle="rgba(3,6,12,.68)";ctx.fillRect(0,0,W,H);
    ctx.fillStyle="rgba(24,31,45,.96)";ctx.beginPath();ctx.roundRect(330,190,340,175,18);ctx.fill();
    ctx.strokeStyle="rgba(255,255,255,.15)";ctx.stroke();
    text("일시정지",500,255,50,"#fff","center");text("P를 눌러 계속하기",500,300,18,"#cbd4e2","center");
  }
  if(mode==="job"){
    const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,"rgba(8,12,20,.76)");bg.addColorStop(1,"rgba(6,8,13,.92)");
    ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
    // decorative glow
    const glow=ctx.createRadialGradient(500,130,20,500,130,360);glow.addColorStop(0,"rgba(107,177,255,.14)");glow.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=glow;ctx.fillRect(0,0,W,360);
    text("MINI MAPLE RPG",500,110,48,"#fff","center");
    text("모험의 시작",500,145,18,"#9fd9ff","center");

    const arr=[["1","전사","높은 HP / 근접"],["2","마법사","높은 MP / 원거리"],["3","궁수","빠른 원거리"],["4","도적","대시 / 근접"]];
    arr.forEach((a,i)=>{
      const x=120+i*190;
      ctx.fillStyle="rgba(18,24,35,.96)";ctx.beginPath();ctx.roundRect(x,210,170,170,16);ctx.fill();
      ctx.strokeStyle="rgba(255,255,255,.10)";ctx.stroke();
      ctx.fillStyle=JOBS[a[1]].color;ctx.beginPath();ctx.roundRect(x+18,228,134,40,10);ctx.fill();
      text(a[0],x+34,255,21,"#111");
      text(a[1],x+85,254,19,"#111","center");
      drawMiniJobIcon(x+85,312,a[1]);
      text(a[2],x+85,354,12,"#d6deea","center");
    });
    text("1 ~ 4 중 하나를 눌러 직업 선택",500,435,21,"#ffe082","center");
  }
  if(mode==="dead"){
    ctx.fillStyle="rgba(4,6,10,.76)";ctx.fillRect(0,0,W,H);
    ctx.fillStyle="rgba(28,20,28,.96)";ctx.beginPath();ctx.roundRect(280,185,440,180,18);ctx.fill();
    text("쓰러졌습니다",500,245,48,"#ff9ca6","center");
    text("R 키를 눌러 초보자 마을에서 부활",500,292,18,"#fff","center");
  }
}
function drawMiniJobIcon(x,y,type){
  ctx.save();ctx.translate(x,y);
  ctx.fillStyle="#f2be92";ctx.beginPath();ctx.arc(0,-5,13,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=JOBS[type].color;ctx.fillRect(-15,8,30,22);
  ctx.fillStyle="#2c3546";ctx.fillRect(-10,30,8,9);ctx.fillRect(2,30,8,9);
  ctx.fillStyle="#4b3227";ctx.fillRect(-10,-16,20,5);
  ctx.fillStyle="#222";ctx.fillRect(-6,-7,3,3);ctx.fillRect(4,-7,3,3);
  ctx.restore();
}
function drawParticles(){
  for(const p of particles){
  ctx.globalAlpha=clamp(p.life/40,0,1);
  ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,Math.max(1.5,4*p.life/45),0,Math.PI*2);ctx.fill();
}
  ctx.globalAlpha=1;
}
function render(){
  ctx.clearRect(0,0,W,H);
  ctx.save();
  if(shake)ctx.translate(rng(-shake,shake),rng(-shake,shake));
  drawBackground();
  for(const m of monsters)drawMonster(m);
  drawBoss();
  for(const d of drops){ctx.fillStyle=d.type==="meso"?"#ffd75e":"#ff6c7b";ctx.beginPath();ctx.arc(d.x,d.y,8,0,Math.PI*2);ctx.fill();}
  for(const p of projectiles){
    ctx.save();
    ctx.shadowBlur=p.type==="fire"?14:6;ctx.shadowColor=p.type==="fire"?"#ff9f43":"#fff1c4";
    if(p.type==="fire"){
      const gr=ctx.createRadialGradient(p.x,p.y,1,p.x,p.y,10);gr.addColorStop(0,"#fff7d1");gr.addColorStop(.35,"#ffc26a");gr.addColorStop(1,"#ef6a3b");
      ctx.fillStyle=gr;ctx.beginPath();ctx.arc(p.x,p.y,9,0,Math.PI*2);ctx.fill();
    }else{
      ctx.fillStyle="#eadfbd";ctx.beginPath();ctx.roundRect(p.x-10,p.y-2,20,4,2);ctx.fill();
    }
    ctx.restore();
  }
  drawPlayer();drawParticles();ctx.restore();
  drawHUD();drawInventory();drawOverlay();
}
function handlePressed(){
  if(pressed["1"]&&mode==="job")chooseJob(0);
  if(pressed["2"]&&mode==="job")chooseJob(1);
  if(pressed["3"]&&mode==="job")chooseJob(2);
  if(pressed["4"]&&mode==="job")chooseJob(3);
  if(pressed.z)basicAttack();
  if(pressed.x)skill();
  if(pressed.i&&mode==="play")inventoryOpen=!inventoryOpen;
  if(pressed.q&&mode==="play")talkNpc();
  if(pressed.d&&mode==="play"&&!dungeon)enterDungeon();
  if(pressed.p&&mode==="play")paused=!paused;
  if(pressed.s&&mode==="play")saveGame();
  if(pressed.l&&mode==="play")loadGame();
  if(pressed.r)respawn();
  // Inventory hot use: 1~9 when inventory is open, otherwise no action after job selection
  if(inventoryOpen&&mode==="play"){
    for(let n=1;n<=9;n++)if(pressed[String(n)]){if(n===1)usePotion();}
  }
  for(const k in pressed)delete pressed[k];
}
function loop(ts){
  const dt=Math.min(32,ts-lastTime||16);lastTime=ts;
  handlePressed();update(dt);render();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
